<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>diskorse mobile app, version B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5448EE; --brand-ink:#3A30C4; --brand-soft:#EEEDFD; --brand-tint:#F6F5FE;
  --ink:#15132B; --body:#3B3950; --muted:#6E6C82; --faint:#A3A1B4;
  --line:#ECEBF3; --bg:#FFFFFF; --page:#E9E8F1;
  --night:#1C1838; --night-2:#2A2550;
  --live:#E5484D; --live-soft:#FDECEC;
  --green:#15803D; --green-soft:#E8F6EE; --amber:#B4610E; --amber-soft:#FDF2E3;
  --pink:#D6336C; --teal:#0F8F7E;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --tab-h:62px; --head-h:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--page);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:28px 16px;min-height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
input{font:inherit}
svg{display:block}

/* ---------- phone frame ---------- */
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;position:relative;overflow:hidden;
  box-shadow:0 0 0 11px #15132B,0 0 0 12px #3b3852,0 30px 60px rgba(21,19,43,.28);flex:none}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px 0 32px;font-size:14px;font-weight:700;position:relative;z-index:30;background:var(--bg)}
.status .isl{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:118px;height:30px;background:#000;border-radius:20px}
.status .sig{display:flex;gap:5px;align-items:center}
.app{position:absolute;inset:44px 0 0 0;display:flex;flex-direction:column}
@media (max-width:520px){
  body{padding:0;gap:0;background:var(--bg)}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .status{display:none}
  .app{inset:0}
  .notes{display:none}
}

/* ---------- header ---------- */
.head{flex:none;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:20;position:relative;transition:margin-top .22s ease}
.head-row{height:var(--head-h);display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:0 12px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#8a6a55,#3c2a22);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.wordmark{justify-self:center;font-weight:800;font-size:23px;letter-spacing:-.6px;color:var(--brand)}
.head-actions{display:flex;gap:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--ink)}
.icon-btn:active{background:var(--brand-tint)}
.dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px #fff}
.title-row{height:var(--head-h);display:flex;align-items:center;gap:6px;padding:0 8px}
.title-row h1{font-size:18px;font-weight:800;letter-spacing:-.3px;flex:1;text-align:center}

.toptabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 4px}
.toptabs::-webkit-scrollbar{display:none}
.toptab{flex:1 0 auto;padding:0 14px;height:46px;font-size:15px;font-weight:600;color:var(--muted);position:relative;white-space:nowrap}
.toptab.on{color:var(--ink);font-weight:700}
.toptab.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:4px;border-radius:4px;background:var(--brand)}
.seg{display:flex;background:var(--brand-tint);border-radius:999px;padding:4px;margin:12px 16px 4px}
.seg button{flex:1;height:34px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,19,43,.12)}

/* ---------- scroll area ---------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:calc(var(--tab-h) + 24px);position:relative}
.scroll::-webkit-scrollbar{display:none}

/* ---------- bottom tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + 18px);padding-bottom:18px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:25}
@media (max-width:520px){.tabbar{height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}}
.tb{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tb.on{color:var(--ink)}
.tb .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.tb .pic{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,#8a6a55,#3c2a22);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.tb.on .pic{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

/* Live centre button */
.tb-live{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:var(--tab-h);padding-bottom:12px;position:relative}
.live-btn{width:58px;height:58px;border-radius:50%;margin-bottom:3px;display:grid;place-items:center;color:#fff;position:relative;
  background:radial-gradient(circle at 35% 30%,#7a70ff,var(--brand) 55%,#3A30C4);box-shadow:0 0 0 5px #fff,0 8px 20px rgba(84,72,238,.45)}
.live-btn .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--live);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.32);opacity:0}}
.live-btn .count{position:absolute;top:-6px;right:-8px;background:var(--live);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:2px 6px;box-shadow:0 0 0 2px #fff}
.tb-live small{font-size:11px;font-weight:700;color:var(--live);line-height:1}
.tb-live.on .live-btn{box-shadow:0 0 0 5px #fff,0 0 0 7px var(--brand),0 8px 20px rgba(84,72,238,.45)}

/* FAB */
.fab{position:absolute;right:16px;bottom:calc(var(--tab-h) + 34px);width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(84,72,238,.42);z-index:24;transition:transform .18s}
.fab:active{transform:scale(.94)}
.fab.wide{width:auto;border-radius:28px;padding:0 20px 0 16px;display:flex;gap:8px;font-weight:700;font-size:15px}
@media (max-width:520px){.fab{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px)}}

/* ---------- journey strip ---------- */
.journey{margin:12px 16px 4px;background:var(--night);color:#fff;border-radius:var(--r-m);padding:14px 14px 14px 16px;display:flex;align-items:center;gap:14px;text-align:left;width:calc(100% - 32px)}
.jring{width:52px;height:52px;flex:none;position:relative}
.jring svg{transform:rotate(-90deg)}
.jring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800}
.journey .jt{flex:1;min-width:0}
.journey .jd{font-size:12.5px;color:#B9B3F5;font-weight:600}
.journey .jtask{font-size:15px;font-weight:700;line-height:1.25;margin-top:2px}
.journey .jn{font-size:12.5px;color:#9C97C4;margin-top:3px}
.journey .jgo{width:34px;height:34px;border-radius:50%;background:var(--night-2);display:grid;place-items:center;flex:none}

/* ---------- live strip (B) ---------- */
.livestrip{padding:12px 0 6px}
.livestrip h3{font-size:15px;font-weight:800;padding:0 16px 8px;display:flex;align-items:center;gap:7px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.lrow{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.lrow::-webkit-scrollbar{display:none}
.lcard{flex:none;width:228px;border-radius:var(--r-m);background:linear-gradient(160deg,#241f4a,#14122b);color:#fff;padding:12px;text-align:left}
.lcard .lt{font-size:14.5px;font-weight:700;line-height:1.25;margin:8px 0 10px}
.faces{display:flex}
.faces span{width:26px;height:26px;border-radius:50%;border:2px solid #1d1a3c;margin-right:-7px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.scale{height:6px;border-radius:4px;overflow:hidden;display:flex;background:#3a355f}
.scale i{display:block;height:100%}
.lmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#B9B3F5;margin-top:8px}
.livetag{display:inline-flex;align-items:center;gap:5px;background:var(--live);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px}

/* ---------- feed post ---------- */
.post{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.post .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.pmeta{display:flex;align-items:center;gap:6px;font-size:14.5px;min-width:0}
.pmeta b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta .t{color:var(--muted);flex:none}
.kind{margin-left:auto;flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px}
.ptitle{font-size:16.5px;font-weight:700;line-height:1.3;margin-top:4px;letter-spacing:-.1px}
.pbody{font-size:15px;color:var(--body);line-height:1.45;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--body)}
.actions{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:13px;padding-right:10px}
.actions button{display:flex;align-items:center;gap:6px;padding:4px 0}
.actions .liked{color:var(--live)}
.boost{display:flex;gap:8px;margin-top:10px;align-items:center}
.boost .b1{font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:4px 10px}
.boost .b2{font-size:12px;font-weight:700;color:var(--brand);border:1.5px dashed var(--brand);border-radius:999px;padding:3px 10px}
.vote{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vote button{width:100%;display:flex;justify-content:space-between;padding:10px 12px;font-size:14px;font-weight:600;position:relative;text-align:left}
.vote button+button{border-top:1px solid var(--line)}
.vote .fill{position:absolute;inset:0 auto 0 0;background:var(--brand-soft);z-index:0;transition:width .5s}
.vote span{position:relative;z-index:1}
.contrib{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.contrib .faces span{border-color:#fff;width:24px;height:24px}
.counsel{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.counsel .cp{flex:1;font-size:13.5px;color:var(--body)}
.counsel .cp b{display:block;color:var(--ink);font-size:15px}
.btn{height:36px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--brand-soft);color:var(--brand-ink)}
.btn.line{border:1.5px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.full{width:100%;height:46px;font-size:15.5px}

.discover{margin:14px 16px;padding:14px;border-radius:var(--r-m);background:var(--brand-tint);border:1px solid #E3E1FB}
.discover h4{font-size:15.5px;font-weight:800}
.discover p{font-size:13.5px;color:var(--muted);margin-top:2px}
.drow{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.drow::-webkit-scrollbar{display:none}
.dpill{flex:none;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #E3E1FB;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}

/* ---------- lists ---------- */
.sechead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.sechead h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
.sechead p{font-size:13.5px;color:var(--muted)}
.lnk{color:var(--brand);font-weight:700;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .sq{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.row .ci{flex:1;min-width:0}
.row .ci b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ci span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .tm{font-size:12.5px;color:var(--faint);align-self:flex-start;margin-top:3px}
.unread{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.filterbar{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{margin:8px 16px;height:42px;border-radius:999px;background:var(--brand-tint);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);font-size:15px}
.search input{border:0;background:none;outline:0;flex:1;color:var(--ink)}
.empty{padding:28px 24px;text-align:center;color:var(--muted);font-size:14.5px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* network */
.interest{margin:12px 16px;border-radius:var(--r-l);padding:18px;color:#fff;background:linear-gradient(150deg,#4b40d8,#221d55);position:relative;overflow:hidden}
.interest h3{font-size:19px;font-weight:800;line-height:1.2;max-width:230px}
.interest p{font-size:14px;color:#D2CEFB;margin:6px 0 14px;max-width:230px}
.stack{position:absolute;right:14px;top:16px;width:64px;height:78px}
.stack i{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.stack i:nth-child(1){transform:rotate(-10deg) translateX(-8px)}
.stack i:nth-child(2){transform:rotate(6deg) translateX(6px)}
.stack i:nth-child(3){background:#fff;display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:20px}
.req{display:flex;gap:12px;padding:12px 16px;align-items:center}
.req+.req{border-top:1px solid var(--line)}
.req .ci{flex:1;min-width:0}
.req .ci b{font-size:15.5px;display:block}
.req .ci span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req .btns{display:flex;gap:6px}
.req .btns .btn{height:32px;padding:0 12px;font-size:13px}
.pymk{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 8px;scrollbar-width:none}
.pymk::-webkit-scrollbar{display:none}
.pcard{flex:none;width:150px;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;text-align:center;padding-bottom:12px}
.pcard .bn{height:46px;background:linear-gradient(120deg,#d9d4ff,#a59cf5)}
.pcard .av{width:58px;height:58px;border-radius:50%;margin:-29px auto 6px;border:3px solid #fff;display:grid;place-items:center;color:#fff;font-weight:800}
.pcard b{font-size:14.5px;display:block}
.pcard span{font-size:12.5px;color:var(--muted);display:block;margin:2px 10px 10px;min-height:32px}
.mapbtn{margin:4px 16px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);width:calc(100% - 32px);text-align:left}
.mapbtn .mi{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.mapbtn b{display:block;font-size:15px}
.mapbtn span{font-size:13px;color:var(--muted)}

/* profile */
.cover{height:118px;background:linear-gradient(120deg,#5448EE,#8E7CF8 60%,#E3A6D8)}
.pf{padding:0 16px}
.pf .big{width:82px;height:82px;border-radius:50%;border:4px solid #fff;margin-top:-41px;background:linear-gradient(140deg,#8a6a55,#3c2a22);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800}
.pf .top{display:flex;justify-content:space-between;align-items:flex-end}
.pf h2{font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.pf .handle{font-size:14.5px;color:var(--muted)}
.pf .bio{font-size:15px;line-height:1.45;margin-top:8px;color:var(--body)}
.stats{display:flex;margin-top:12px;font-size:14.5px;color:var(--muted)}
.stats div{padding:0 14px}
.stats div:first-child{padding-left:0}
.stats div+div{border-left:1px solid var(--line)}
.stats b{color:var(--ink)}
.vouch{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--body)}
.vouch .vb{background:var(--green-soft);color:var(--green);font-weight:800;border-radius:999px;padding:4px 10px;font-size:13px}
.gallery{margin:14px 16px 4px;border-radius:var(--r-m);padding:14px;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#FFF4E6,#FDE7F1);text-align:left;width:calc(100% - 32px)}
.gallery .gi{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--pink)}
.gallery b{display:block;font-size:15.5px}
.gallery span{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 16px 6px}
.quick button{border:1px solid var(--line);border-radius:14px;padding:10px 6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick small{font-weight:600;color:var(--muted);font-size:11.5px}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(21,19,43,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:24px 24px 0 0;z-index:41;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:4px;background:#D9D7E5;margin:8px auto 4px;flex:none}
.sheet .sh{padding:6px 18px 10px;display:flex;align-items:center;justify-content:space-between;flex:none}
.sheet .sh h3{font-size:19px;font-weight:800;letter-spacing:-.2px}
.sheet .sb{overflow-y:auto;padding:0 0 28px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 8px}
.ctile{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.ctile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.ctile b{font-size:15px}
.ctile span{font-size:12.5px;color:var(--muted);line-height:1.3}
.ctile.hero{grid-column:1/-1;flex-direction:row;align-items:center;background:var(--live-soft);border-color:#F8D3D4}
.ctile.hero .tx{flex:1}
.drawer{position:absolute;top:0;bottom:0;left:0;width:84%;background:#fff;z-index:41;transform:translateX(-102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:56px 0 24px}
@media (max-width:520px){.drawer{padding-top:24px}}
.drawer.on{transform:none}
.drawer .who{padding:0 20px 14px;border-bottom:1px solid var(--line)}
.drawer .who b{display:block;font-size:18px;margin-top:10px}
.drawer .who span{font-size:14px;color:var(--muted)}
.plan{margin:12px 20px;padding:12px;border-radius:14px;background:var(--brand-tint);display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.plan b{display:block;font-size:15px}
.dlist{overflow-y:auto;flex:1}
.ditem{display:flex;align-items:center;gap:16px;padding:12px 20px;font-size:17px;font-weight:700;width:100%;text-align:left}
.ditem.sm{font-size:15px;font-weight:600;color:var(--body);padding:10px 20px}
.dsep{height:1px;background:var(--line);margin:8px 20px}
.dlabel{font-size:13px;font-weight:700;color:var(--faint);padding:8px 20px 2px}

/* overlays (full screen) */
.over{position:absolute;inset:0;background:#fff;z-index:35;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.over.on{transform:none}
.over .scroll{padding-bottom:30px}

/* swipe deck */
.deck{position:relative;height:430px;margin:12px 20px}
.scard{position:absolute;inset:0;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px rgba(21,19,43,.12);padding:18px;display:flex;flex-direction:column;transition:transform .35s,opacity .35s}
.scard .sa{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800}
.scard h3{font-size:21px;font-weight:800;margin-top:10px}
.scard .r{font-size:14px;color:var(--muted)}
.scard .why{margin-top:14px;background:var(--brand-tint);border-radius:14px;padding:12px;font-size:14px;line-height:1.4;color:var(--body)}
.scard .why b{display:block;color:var(--brand-ink);font-size:13px;margin-bottom:3px}
.scard .so{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:13.5px;line-height:1.35}
.scard .so div{border:1px solid var(--line);border-radius:12px;padding:10px}
.scard .so small{display:block;color:var(--muted);font-weight:700;margin-bottom:2px}
.dbtns{display:flex;justify-content:center;gap:22px;margin-top:6px}
.dbtns button{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 16px rgba(21,19,43,.12);background:#fff}
.dbtns .yes{background:var(--brand);color:#fff}

/* mind map */
.mind{position:relative;height:560px;margin:8px}
.mind svg{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;font-weight:700}
.node i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;color:#fff;font-style:normal;font-size:14px;margin:0 auto 4px;border:3px solid #fff;box-shadow:0 4px 12px rgba(21,19,43,.15)}
.node.me i{width:64px;height:64px;font-size:18px}

/* live stage */
.stage{background:#14131C;color:#fff;flex:1;display:flex;flex-direction:column}
.stage .podium{margin:12px;border-radius:20px;height:210px;background:linear-gradient(160deg,#2e2a52,#1E1C29);display:flex;align-items:flex-end;padding:12px;position:relative}
.stage .podium .who{font-weight:700}
.stage .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 12px}
.stage .col{border-radius:14px;background:#1E1C29;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:700}
.stage .col .faces{justify-content:center;margin-top:8px}
.react{display:flex;gap:6px;overflow-x:auto;padding:12px;scrollbar-width:none}
.react button{flex:none;border:1px solid #3a3752;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:#E9E7F5}

.toast{position:absolute;left:50%;bottom:calc(var(--tab-h) + 96px);transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ---------- v2 overrides: centered, smaller avatars, outline tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1.3px solid var(--brand);color:#4A3FE0;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;line-height:1.2;flex:none}
.tag.soft{border-color:#CFCBF8}
.tag.dash{border-style:dashed}
.post{display:block;padding:14px 16px 4px;border-bottom:1px solid var(--line)}
.phead{display:flex;align-items:center;gap:10px}
.pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:none}
.pwho{flex:1;min-width:0;line-height:1.2}
.pwho b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwho span{font-size:12.5px;color:var(--muted)}
.post .ptitle{margin-top:10px}
.post .chips{gap:6px;margin-top:10px}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px;padding:0;color:var(--muted);font-size:13px}
.actions button{height:40px;justify-content:center;padding:0}
.sechead{flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 24px 8px}
.sechead p{line-height:1.4;margin-top:3px}
.discover{text-align:center}
.drow{flex-wrap:wrap;justify-content:center;overflow:visible}
.interest{text-align:center;padding:22px 18px}
.interest .num{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--brand);display:grid;place-items:center;font-size:22px;font-weight:800;margin:0 auto 12px}
.interest h3,.interest p{max-width:none;margin-left:auto;margin-right:auto}
.interest p{max-width:260px}
.center-bar{justify-content:center}
.pfc{text-align:center;padding:0 20px}
.pfc .big{width:76px;height:76px;border-radius:50%;border:4px solid #fff;margin:-38px auto 0;background:linear-gradient(140deg,#8a6a55,#3c2a22);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}
.pfc h2{font-size:21px;font-weight:800;margin-top:8px;letter-spacing:-.3px;display:flex;align-items:center;justify-content:center;gap:6px}
.pfc .role{font-size:14px;color:var(--muted)}
.pfc .bio{font-size:14.5px;line-height:1.45;margin:8px auto 0;color:var(--body);max-width:300px}
.pfc .stats{justify-content:center}
.pfc .vouch{justify-content:center}
.pfc .btns{display:flex;justify-content:center;gap:8px;margin-top:12px}
.scard{text-align:center}
.scard .sa{margin:0 auto}
.scard .so{text-align:left}

/* journey card, same as the web version */
.jw{display:block;width:calc(100% - 32px);margin:12px 16px 6px;background:#1C1838;color:#fff;border-radius:22px;padding:16px 16px 14px;text-align:left;box-shadow:0 10px 24px rgba(28,24,56,.25)}
.jw .jtop{display:flex;justify-content:space-between;align-items:center}
.jw .jpill{background:#2E2955;color:#E7E4FF;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 12px;letter-spacing:.2px}
.jw .jsee{font-size:14px;font-weight:700;display:flex;align-items:center;gap:4px}
.jw .jlab{font-size:12.5px;font-weight:700;color:#B9B3F5;margin-top:14px;letter-spacing:.4px}
.jw .jtask{font-size:17px;font-weight:700;line-height:1.3;margin-top:4px}
.jw .jbot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.jw .jnum{font-size:40px;font-weight:800;line-height:1}
.jw .jsub{font-size:13.5px;color:#8F89C2;margin-top:4px}
.jw .bars{display:flex;align-items:flex-end;gap:5px;height:38px}
.jw .bars i{display:block;width:5px;border-radius:3px;background:#57517F}
.jw .bars i.on{background:#fff}


/* ---------- v3: details, chat, boost, journey sheet ---------- */
.ptap{display:block;width:100%;text-align:left;cursor:pointer}
.actions.boosted{grid-template-columns:auto auto auto 1fr;gap:18px}
.actions.boosted button{justify-content:flex-start}
.actions .bwrap{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.boostpill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:#FBEBDD;color:#9A4A12;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.bipill{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--brand-tint);border:1.3px dashed var(--brand);color:#4A3FE0;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.dbtns2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 20px}
.dbtns2 button{height:52px;border-radius:999px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.dbtns2 .nx{background:#fff;border:1.5px solid #DAD8E6;color:var(--ink);box-shadow:0 2px 8px rgba(21,19,43,.06)}
.dbtns2 .mt{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(84,72,238,.35)}
/* journey sheet like the web modal */
.jmc{display:flex;align-items:flex-end;gap:9px;height:100px;padding:14px 20px 4px}
.jmc .bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.jmc .bar{width:100%;max-width:44px;border-radius:7px 7px 3px 3px;background:#E6E3FB}
.jmc .bar.now{background:var(--brand)}
.jmc .bar.done{background:#16A34A}
.jmc .bd{font-size:11px;font-weight:700;color:var(--faint)}
.jmc .bd.now{color:var(--brand)}
.jrow{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-top:1px solid var(--line)}
.jrow .dn{width:44px;flex:none;font-size:13px;font-weight:800;color:var(--faint);padding-top:2px}
.jrow.now .dn{color:var(--brand)}
.jrow.done .dn{color:#15803D}
.jrow .jb{flex:1;min-width:0}
.jrow .jb b{display:block;font-size:14.5px;line-height:1.35}
.jrow .jb span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.jrow .val{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;border:1.5px solid #E2E0EC;color:var(--faint)}
.jrow .val.done{background:#16A34A;border-color:#16A34A;color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.35)}
.jrow .val.now{border-color:var(--brand);color:var(--brand);background:var(--brand-tint)}
.jcheck{display:inline-flex;align-items:center;gap:6px;color:#15803D;font-weight:700}
.jcheck i{width:18px;height:18px;border-radius:50%;background:#16A34A;display:grid;place-items:center;color:#fff}
.jfinal{margin:6px 14px 0;border:1.5px solid #F2C27A;background:#FFF7EA;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.jfinal .dn{color:#B4610E;font-weight:800;font-size:13px;width:44px}
.jfinal b{display:block;font-size:15px;color:#7A3E06}
.jfinal span{font-size:12.5px;color:#9A5A1A}
.jfinal .val{width:38px;height:38px;border-radius:50%;background:#F7D9A8;color:#8A4A0B;display:grid;place-items:center}
/* detail screens */
.dpad{padding:14px 16px}
.dtitle{font-size:21px;font-weight:800;line-height:1.25;letter-spacing:-.3px;margin-top:12px}
.dbody{font-size:15.5px;line-height:1.55;color:var(--body);margin-top:8px}
.dsec{font-size:15px;font-weight:800;padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 16px 10px}
.card .ch{display:flex;align-items:center;gap:10px}
.card .ch b{font-size:14.5px}
.card p{font-size:14.5px;line-height:1.45;color:var(--body);margin-top:8px}
.vbadge{color:var(--brand);display:inline-flex}
.src{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--brand-ink);background:var(--brand-tint);border-radius:8px;padding:4px 8px}
.composer{flex:none;border-top:1px solid var(--line);padding:10px 12px 22px;display:flex;gap:8px;align-items:center;background:#fff}
.composer input{flex:1;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--brand-tint);padding:0 16px;outline:0;font-size:15px}
.composer .send{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 0}
.side{border-radius:16px;padding:14px;text-align:center;border:1.5px solid var(--line)}
.side.a{border-color:#C9C3FA;background:#F6F5FE}
.side.b{border-color:#F3D2B3;background:#FFF7EF}
.side b{display:block;font-size:15px}
.side .pct{font-size:26px;font-weight:800;margin:6px 0 2px}
.side span{font-size:12.5px;color:var(--muted)}
.side button{margin-top:10px;width:100%}
.timer{display:flex;justify-content:center;gap:8px;margin:12px 16px 0;font-size:13px;color:var(--muted)}
.timer b{color:var(--ink)}
.arg{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.arg .bar{width:4px;border-radius:4px;flex:none}
.arg .ab{flex:1}
.arg .ab b{font-size:14px}
.arg .ab p{font-size:14.5px;line-height:1.45;color:var(--body);margin-top:3px}
.arg .ab small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
.paywall{margin:16px;border-radius:18px;padding:18px;text-align:center;background:var(--brand-tint);border:1px solid #E3E1FB}
.paywall b{display:block;font-size:17px}
.paywall p{font-size:13.5px;color:var(--muted);margin:4px 0 12px}
.fade{position:relative;max-height:150px;overflow:hidden}
.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(rgba(255,255,255,0),#fff)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 16px}
.slot{height:44px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.slot.on{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}
.days{display:flex;gap:8px;padding:0 16px 10px}
.dayc{flex:1;border-radius:14px;border:1.5px solid var(--line);padding:8px 0;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.dayc b{display:block;font-size:17px;color:var(--ink)}
.dayc.on{border-color:var(--brand);background:var(--brand-tint)}
.bubbles{display:flex;flex-direction:column;gap:8px;padding:14px 14px 18px}
.bub{max-width:78%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.4}
.bub.them{background:#F1F0F7;align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bub small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.daysep{text-align:center;font-size:12px;color:var(--faint);font-weight:600;margin:6px 0}
.matchban{margin:14px 16px 0;border-radius:16px;padding:14px;text-align:center;background:#F6F5FE;border:1px solid #E3E1FB}
.matchban b{display:block;font-size:15px}
.matchban span{font-size:13px;color:var(--muted)}
.offer{margin:10px 16px 0;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;width:calc(100% - 32px)}
.offer .oi{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.offer b{display:block;font-size:14.5px}
.offer span{font-size:12.5px;color:var(--muted)}
.esc{margin:12px 16px 0;border-radius:14px;background:#E8F6EE;color:#136B35;padding:12px 14px;font-size:13.5px;line-height:1.4}
.esc b{display:block;font-size:14.5px}
.rcover{height:120px;background:#2E2A55;display:flex;align-items:flex-end;padding:14px 16px;color:#fff}
.rcover b{font-size:22px;font-weight:800}
.vstat{display:flex;justify-content:center;gap:18px;font-size:13.5px;color:var(--muted);margin-top:10px}
.vstat b{color:var(--ink)}
.bi-lede{margin:6px 16px 0;padding:12px 14px;border-left:3px solid var(--brand);background:var(--brand-tint);border-radius:0 12px 12px 0;font-size:15px;line-height:1.45;color:var(--body)}
.poll{margin:10px 16px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.poll button{width:100%;display:flex;justify-content:space-between;padding:12px 14px;font-size:14px;font-weight:600;position:relative;text-align:left}
.poll button+button{border-top:1px solid var(--line)}
.over .detail{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:24px}
.over .detail::-webkit-scrollbar{display:none}


/* ---------- v4: darker tags, aligned boost row, snippet composer ---------- */
.tag{color:#2F27A8;border-color:#3A30C4}
.tag.soft{color:#2F27A8;border-color:#7A70E8}
.actions.boosted{display:flex;align-items:center;gap:16px;grid-template-columns:none}
.actions.boosted>button{height:40px}
.actions .bwrap{margin-left:auto;gap:6px}
.boostpill,.bipill{height:28px;padding:0 10px;font-size:12px;line-height:1;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-sizing:border-box}
.bipill{border:1.3px dashed #3A30C4;color:#2F27A8;background:var(--brand-tint)}
.actions .bwrap .bipill{height:28px;padding:0 10px;justify-content:center;gap:5px}
.cmp{flex:1;display:flex;flex-direction:column;min-height:0}
.cmp-top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.cmp-body{flex:1;overflow-y:auto;padding:14px 16px}
.cmp-who{display:flex;align-items:center;gap:10px}
.cmp-who b{font-size:15px;display:block}
.aud{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#2F27A8;border:1.3px solid #7A70E8;border-radius:999px;padding:2px 9px;margin-top:2px}
.cmp-prompt{font-size:13.5px;color:var(--muted);margin:14px 0 6px;line-height:1.4}
.cmp textarea{width:100%;min-height:150px;border:0;outline:0;resize:none;font:inherit;font-size:18px;line-height:1.45;color:var(--ink);background:none}
.cmp textarea::placeholder{color:#A3A1B4}
.stypes{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.stype{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1.3px solid #DAD8E6;font-size:13.5px;font-weight:600;color:var(--body)}
.stype i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.stype.on{border-color:#3A30C4;color:#2F27A8;background:var(--brand-tint)}
.stype.on i{opacity:1}
.cmp-hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.cmp-opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin-top:14px}
.cmp-opt b{display:block;font-size:14.5px}
.cmp-opt span{font-size:12.5px;color:var(--muted)}
.switch{width:46px;height:28px;border-radius:999px;background:#DAD8E6;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
.cmp-bar{flex:none;display:flex;align-items:center;gap:4px;padding:8px 10px 22px;border-top:1px solid var(--line)}
.cmp-bar .icon-btn{color:var(--brand)}
.ringw{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.postbtn{height:36px;padding:0 18px;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;font-size:14.5px}
.postbtn:disabled{opacity:.4;cursor:default}


/* ---------- v6: feed switch + type filter row ---------- */
.fhead{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.fswitch{display:inline-flex;background:#F2F1FA;border-radius:999px;padding:3px;flex:none}
.fswitch button{height:30px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted)}

function wireComposer(){
  SNIP.text=''; SNIP.type=''; SNIP.boost=false;
  const ta=document.getElementById('snipText'), post=document.getElementById('snipPost'), ring=document.getElementById('snipRing'), cnt=document.getElementById('snipCount');
  const C=2*Math.PI*10;
  setTimeout(()=>ta.focus(),300);
  ta.addEventListener('input',()=>{ SNIP.text=ta.value; const n=ta.value.length, left=SNIP_LIMIT-n;
    cnt.textContent=left; cnt.style.color = left<40 ? '#C93A3F' : '';
    ring.setAttribute('stroke-dasharray', `${C*n/SNIP_LIMIT} ${C}`); ring.setAttribute('stroke', left<40 ? '#C93A3F' : '#5448EE');
    post.disabled = !ta.value.trim(); });
  document.getElementById('snipTypes').addEventListener('click',e=>{ const b=e.target.closest('[data-stype]'); if(!b) return; e.stopPropagation();
    SNIP.type = SNIP.type===b.dataset.stype ? '' : b.dataset.stype;
    document.querySelectorAll('.stype').forEach(x=>x.classList.toggle('on', x.dataset.stype===SNIP.type)); });
  document.getElementById('snipBoost').addEventListener('click',e=>{ e.stopPropagation(); SNIP.boost=!SNIP.boost; e.currentTarget.classList.toggle('on',SNIP.boost); e.currentTarget.setAttribute('aria-checked',SNIP.boost);
    paintBI(); if(SNIP.boost && !BI.saved) openBI(); });
  paintBI();

    closeOver(); S.tab='home'; S.top='foryou'; render(); toast('Snippet posted'); });
}

const scroll = document.getElementById('scroll');
function render(keepScroll){
  renderHead(); renderTabbar(); renderFab();
  const y = scroll.scrollTop;
  scroll.innerHTML = ({home:scrHome, bq:()=>scrBQ(false), network:scrNetwork, messages:scrMessages, live:scrLive, profile:scrProfile}[S.tab])();

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1600); }
function openOver(k){ const o=document.getElementById('over'); o.innerHTML=OVER[k](); o.classList.add('on'); if(k==='compose') wireComposer(); else o.querySelector('[data-close]')?.focus(); }
function closeOver(){ document.getElementById('over').classList.remove('on'); }
function openSheet(k){ const s=document.getElementById('sheet'); s.innerHTML=SHEET[k](); s.classList.add('on'); document.getElementById('scrim').classList.add('on'); }
function closeAll(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); }

document.addEventListener('click', e => {
  const pv = e.target.closest('.post .pav, .post .pwho');
  if (pv){ const nm = pv.closest('.phead').querySelector('.pwho b').textContent; if (nm!=='Kanishma Ray'){ CURP = nm; closeAll(); openOver('person'); return; } }
  const det = e.target.closest('[data-detail]');
  if (det && det.dataset.detail==='cs'){ CS_OWNER = det.closest('.post') && det.closest('.post').querySelector('.pwho b').textContent==='Kanishma Ray' ? 'me' : 'leena'; }
  if (det && det.dataset.detail==='da'){ const pw = det.closest('.post') && det.closest('.post').querySelector('.pwho b'); DA_MINE = !!(pw && pw.textContent==='Kanishma Ray'); DA_STATE = (det.closest('.setrow') || DA_MINE) ? 'win' : 'vote'; }
  if (det && !e.target.closest('button:not([data-detail])')){ closeAll(); openOver(det.dataset.detail); return; }
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if (d.tab){ closeAll(); closeOver(); S.tab=d.tab; render(); return; }
  if (d.top){ if(d.top==='foryou' && S.top==='foryou'){ S.mode = S.mode==='all'?'following':'all'; } S.top=d.top; render(); return; }
  if (d.mode){ S.mode=d.mode; render(true); return; }
  if (d.cs){ CS_OWNER=d.cs; closeAll(); openOver('cs'); return; }
  if (d.da){ DA_STATE=d.da; const sc=document.querySelector('#over .detail').scrollTop; openOver('da'); document.querySelector('#over .detail').scrollTop=sc; return; }
  if (d.kf){ S.kf=d.kf; render(true); return; }
  if (d.bq){ S.bq=d.bq; render(); return; }
  if (d.bqf){ S.bqf=d.bqf; render(true); return; }
  if (d.net){ S.net=d.net; render(); return; }
  if (d.nt){ S.netTab=d.nt; render(true); return; }
  if (d.msg){ S.msg=d.msg; render(); return; }
  if (d.prof){ S.prof=d.prof; render(true); return; }
  if (d.goto){ closeAll(); S.tab='home'; S.top=d.goto; render(); return; }
  if (d.over){ closeAll(); openOver(d.over); return; }
  if (d.close!==undefined){ closeOver(); return; }
  if (d.sheet){ openSheet(d.sheet); return; }
  if (d.closesheet!==undefined){ closeAll(); return; }
  if (d.toast){ toast(d.toast); return; }
  if (t.id==='openDrawer' || t.id==='openDrawer2'){ openDrawer(); return; }
  if (d.act==='create'){ openSheet('create'); return; }
  if (d.act==='postbq'){ toast('Brand Query composer opens here'); return; }
  if (d.act==='newmsg'){ toast('New message'); return; }
  if (d.act==='golive'){ closeAll(); toast('Pick a Room to go live in'); return; }
  if (d.join!==undefined){ t.textContent = t.textContent==='Join'?'Joined':'Join'; t.className = t.textContent==='Joined'?'btn line':'btn primary'; t.style.cssText='height:32px;padding:0 14px;font-size:13.5px'; return; }
  if (d.vote){ const box=t.parentElement; if(box.dataset.done) return; box.dataset.done=1;
    box.querySelectorAll('button').forEach(b=>{ b.querySelector('.fill').style.width=b.dataset.vote+'%'; b.querySelector('.pc').textContent=b.dataset.vote+'%'; b.querySelector('.pc').style.color='var(--ink)'; });
    t.querySelector('.fill').style.background='#DCD8FD'; return; }
  if (d.swipe){ const deck=document.getElementById('deck'); const cards=deck.querySelectorAll('.scard'); const top=cards[cards.length-1]; if(!top) return;
    top.style.transform=`translateX(${d.swipe==='yes'?420:-420}px) rotate(${d.swipe==='yes'?18:-18}deg)`; top.style.opacity=0;
    setTimeout(()=>{ top.remove(); if(!deck.querySelector('.scard')) deck.innerHTML='<div class="empty" style="padding-top:120px"><b>That is everyone for this week</b>A new list arrives next Monday.</div>'; },320);
    if(d.swipe==='yes') toast('Sent. If they tap Match too, chat opens'); return; }
  if (t.classList.contains('act-like')){ t.classList.toggle('liked'); const s=t.querySelector('span'); const n=parseInt(s.textContent||'0')+(t.classList.contains('liked')?1:-1); s.textContent=n||''; return; }
  if (t.classList.contains('book')){ toast('Pick a time for your Counsel'); return; }
});

document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeAll(); closeOver(); }
